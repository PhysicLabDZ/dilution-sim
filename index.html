<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f8fd">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>التخفيف المتسلسل — الحبيبة لا تُقسَّم</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(#fdfefe,#dfe5ec);overflow:hidden;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:size;background:#2a5d9a}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #msg{position:absolute;top:2.5cqh;left:50%;transform:translateX(-50%);max-width:70cqw;text-align:center;
       background:rgba(18,50,79,.92);color:#fff;font-size:4.2cqh;line-height:1.5;padding:1.2cqh 3cqw;border-radius:3cqh;
       box-shadow:0 .4cqh 1.6cqh rgba(0,0,0,.25);pointer-events:none}
  .pill{position:absolute;top:87%;transform:translate(-50%,-50%);min-width:6.4cqw;text-align:center;
        background:rgba(255,248,235,.95);color:#4a2a08;font-weight:700;font-size:4cqh;line-height:1;padding:.9cqh .8cqw;border-radius:2cqh;
        border:.5cqh solid transparent;pointer-events:none}
  .pill.src{border-color:#1b7f3a}
  .pill.dst{border-color:#d8791b;border-style:dashed}
  .tag{position:absolute;top:25%;transform:translate(-50%,-50%);color:#12324f;font-size:3.6cqh;font-weight:700;pointer-events:none}
  #bar{position:absolute;bottom:1.5cqh;left:50%;transform:translateX(-50%);display:flex;gap:1cqw;align-items:center;z-index:6;
       background:rgba(10,25,45,.78);padding:1.2cqh 1.6cqw;border-radius:3cqh;white-space:nowrap}
  #bar button,#bar select{font:inherit;font-size:3.5cqh;border:0;border-radius:2cqh;padding:1.2cqh 1.8cqw;color:#fff;background:#3b5b80;cursor:pointer}
  #bar button.on{background:#1b7f3a}
  #bar #go{background:#d8791b;font-weight:700}
  #bar button:disabled{opacity:.45}
  #bar label{color:#cfe3f7;font-size:3.3cqh}
  .seg{display:flex;gap:.6cqw}
  .hit{position:absolute;cursor:pointer}
  #lens{position:absolute;inset:0;display:none;z-index:5}
  #lens.open{display:block}
  .lb{position:absolute;transform:translate(-50%,-50%);border:0;font:inherit;font-size:4cqh;color:#fff;background:rgba(10,25,45,.88);padding:1.4cqh 2.4cqw;border-radius:2.4cqh;cursor:pointer}
  .lb:disabled{opacity:.35}
  #lcap{position:absolute;left:50%;top:85%;transform:translate(-50%,-50%);background:#fff;color:#12324f;font-size:4.2cqh;font-weight:700;padding:1cqh 3cqw;border-radius:3cqh;white-space:nowrap;pointer-events:none}
  /* هاتف أو لوحي بوضع رأسي: يُدار المسرح 90° ليملأ الطول الأكبر للشاشة */
  @media (orientation:portrait) and (pointer:coarse){
    #stage{width:min(100vh,177.78vw);transform:translate(-50%,-50%) rotate(90deg)}
  }
  #panel{display:none;position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.62);align-items:center;justify-content:center}
  #panel.open{display:flex}
  .card{background:#12324f;color:#fff;border-radius:3cqh;padding:3cqh 3.5cqw;width:64cqw;font-size:3.8cqh}
  .card h2{margin:0 0 1.6cqh;font-size:4.8cqh}
  .row{display:flex;align-items:center;justify-content:space-between;gap:2cqw;margin:1.5cqh 0}
  .row input[type=range]{flex:1;accent-color:#d8791b;min-width:0}
  .row b{min-width:7cqw;text-align:center}
  .card button{font:inherit;font-size:3.8cqh;border:0;border-radius:2cqh;padding:1.2cqh 2.4cqw;color:#fff;background:#3b5b80;cursor:pointer}
  .card .seg button.on{background:#1b7f3a}
  .card #pApply{background:#d8791b;font-weight:700}
  .hint{font-size:3.1cqh;color:#cfe3f7;margin:1.2cqh 0;line-height:1.55}
  #info{color:#cfe3f7;font-size:3.1cqh;padding:0 .6cqw}
  button{transition:filter .12s}
  button:hover:not(:disabled){filter:brightness(1.18)}
  button:disabled{cursor:not-allowed}
  .hit:hover{background:rgba(255,255,255,.13);border-radius:2cqh}
  @media (pointer:fine){ #bar button{font-size:3.8cqh} #info{font-size:3.3cqh} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1672" height="941"></canvas>
  <div id="msg"></div>
  <div id="overlay"></div>
  <div id="lens">
    <button class="lb" id="lClose" style="left:50%;top:8%">✕ إغلاق</button>
    <button class="lb" id="lPrev" style="left:76%;top:50%">السابق ▶</button>
    <button class="lb" id="lNext" style="left:24%;top:50%">◀ التالي</button>
    <div id="lcap"></div>
  </div>
  <div id="panel"><div class="card">
    <h2>إعدادات الأستاذ</h2>
    <div class="row"><span>عدد الحبيبات الابتدائي</span><input type="range" id="sN" min="4" max="400" value="128"><b id="vN">128</b></div>
    <div class="row"><span>نسبة النقل</span><input type="range" id="sR" min="10" max="90" step="5" value="50"><b id="vR">50%</b></div>
    <div class="row"><span>وضع النقل</span><div class="seg"><button id="pFixed" class="on">ثابت</button><button id="pRand">عشوائي</button></div></div>
    <p class="hint">ثابت: يُنقل عدد محدّد بالتقريب لأعلى، فلا يفرغ أنبوب يحتوي حبيبات. عشوائي: كل حبيبة تُنقل باحتمال النسبة، فقد يظهر ماء نقي.</p>
    <div class="row"><button id="pApply">تطبيق وإعادة البدء</button><button id="pCancel">إلغاء</button></div>
  </div></div>
  <div id="bar">
    <button id="go">انقل 10 مل</button>
    <button id="lensBtn">عدسة</button>
    <button id="setBtn">⚙ إعدادات</button>
    <button id="reset">إعادة</button>
    <button id="fsBtn">⛶</button>
    <span id="info"></span>
  </div>
</div>

let N0=128, mode='fixed', step=0, busy=false, tubes=[], flights=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const newGrain=()=>({x:rnd(-38,38),y:rnd(368,765),hi:0});

// عناصر الواجهة فوق الأنابيب
const pills=[];
CX.forEach((cx,i)=>{
  const p=document.createElement('div'); p.className='pill'; p.style.left=(cx/W*100)+'%'; $('overlay').appendChild(p); pills.push(p);
  const h=document.createElement('div'); h.className='hit';
  h.style.cssText=`left:${(cx-62)/W*100}%;top:27%;width:${124/W*100}%;height:59%`; h.title='تكبير حبيبات هذا الأنبوب'; h.onclick=()=>openLens(i); $('overlay').appendChild(h);
  const t=document.createElement('div'); t.className='tag'; t.style.left=(cx/W*100)+'%'; t.textContent=i+1; $('overlay').appendChild(t);
});

function msg(t){ $('msg').textContent=t; }
const mic=document.createElement('div'); mic.className='hit';
mic.style.cssText='left:4.8%;top:7.4%;width:13.7%;height:45%'; mic.title='المجهر: تكبير حبيبات الأنبوب الحالي'; mic.onclick=()=>openLens(Math.min(step,CX.length-1)); $('overlay').appendChild(mic);

// العدسة المجهرية: تُظهر كل حبيبات الأنبوب مكبّرة
let lensTube=-1;
function openLens(i){ lensTube=i; $('lens').classList.add('open'); $('msg').style.visibility='hidden'; lensUI(); }
function closeLens(){ lensTube=-1; $('lens').classList.remove('open'); $('msg').style.visibility='visible'; }
function lensUI(){ $('lPrev').disabled=lensTube<=0; $('lNext').disabled=lensTube>=CX.length-1; }
$('lClose').onclick=closeLens;
$('lPrev').onclick=e=>{e.stopPropagation(); if(lensTube>0){lensTube--;lensUI();}};
$('lNext').onclick=e=>{e.stopPropagation(); if(lensTube<CX.length-1){lensTube++;lensUI();}};
$('lens').onclick=e=>{ if(e.target.id==='lens') closeLens(); };
$('lensBtn').onclick=()=>{ lensTube<0?openLens(Math.min(step,CX.length-1)):closeLens(); };

function drawLens(){
  const a=tubes[lensTube], n=a.length, X=836, Y=470, R=300;
  ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.beginPath(); ctx.arc(X,Y,R,0,7); ctx.clip();
  ctx.fillStyle='#e8f3ff'; ctx.fillRect(X-R,Y-R,2*R,2*R);
  if(n>0){ ctx.fillStyle=`rgba(225,40,150,${0.05+0.6*Math.pow(n/N0,0.55)})`; ctx.fillRect(X-R,Y-R,2*R,2*R); }
  const r=n<=4?26:n<=16?20:n<=64?14:n<=150?11:8;
  a.forEach(g=>{
    if(g.lx===undefined){const an=rnd(0,6.283),rd=Math.sqrt(Math.random())*.88; g.lx=Math.cos(an)*rd; g.ly=Math.sin(an)*rd;}
    g.lx+=rnd(-.004,.004); g.ly+=rnd(-.004,.004);
    const d=Math.hypot(g.lx,g.ly); if(d>.9){g.lx*=.9/d; g.ly*=.9/d;}
    const x=X+g.lx*R, y=Y+g.ly*R;
    const gr=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
    gr.addColorStop(0,'#ffb3dc'); gr.addColorStop(.45,'#c2107a'); gr.addColorStop(1,'#5e0840');
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=gr; ctx.fill();
  });
  const v=ctx.createRadialGradient(X,Y,R*.7,X,Y,R); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,20,40,.35)');
  ctx.fillStyle=v; ctx.fillRect(X-R,Y-R,2*R,2*R);
  ctx.restore();
  ctx.beginPath(); ctx.arc(X,Y,R,0,7); ctx.lineWidth=16; ctx.strokeStyle='#1c2733'; ctx.stroke();
  const t=n===0?`الأنبوب ${lensTube+1}: ماء نقي، لا حبيبات`
        :n===1?`الأنبوب ${lensTube+1}: حبيبة واحدة، وهي لا تُقسَّم`
        :`الأنبوب ${lensTube+1}: ${n} حبيبة (مكبّرة)`;
  if($('lcap').textContent!==t) $('lcap').textContent=t;
}

function reset(){
  tubes=CX.map(()=>[]);
  for(let i=0;i<N0;i++) tubes[0].push(newGrain());
  step=0; flights=[]; busy=false;
  msg('اضغط «انقل 10 مل». ولرؤية الحبيبات مكبّرة اضغط أي أنبوب أو المجهر.');
  ui();
}

function ui(){
  $('info').textContent=`${mode==='fixed'?'ثابت':'عشوائي'} · ${N0} · ${Math.round(RATIO*100)}%`;
  const done=step>=CX.length-1;
  $('go').disabled=busy||done;
  pills.forEach((p,i)=>{
    p.classList.toggle('src',!done&&i===step);
    p.classList.toggle('dst',!done&&i===step+1);
  });
}

function transfer(){
  if(busy||step>=CX.length-1) return;
  const s=step, d=s+1, src=tubes[s];
  let chosen;
  if(mode==='fixed'){
    const m=src.length?Math.ceil(src.length*RATIO):0;   // التقريب لأعلى: لا تصل إلى صفر
    chosen=src.slice().sort(()=>Math.random()-.5).slice(0,m);
  }else{
    chosen=src.filter(()=>Math.random()<RATIO);            // كل حبيبة تُنقل باحتمال النسبة
  }
  const out=new Set(chosen); tubes[s]=src.filter(g=>!out.has(g));   // ما يُنقل يغادر الأنبوب المصدر
  tubes[d]=[];
  chosen.forEach((g,i)=>{
    flights.push({d,sx:CX[s]+g.x,sy:g.y,tx:rnd(-38,38),ty:rnd(368,765),t:-(Math.random()*.7),dur:1.0});
  });
  busy=true; ui();
  if(!chosen.length) finish(s,d,0,src.length===0);
}

function finish(s,d,m,srcEmpty){
  busy=false; step=d;
  let t;
  if(srcEmpty) t=`لا حبيبات في الأنبوب ${s+1}، فلا شيء يُنقل. الأنبوب ${d+1} ماء نقي.`;
  else if(m===0) t=`لم تنتقل أي حبيبة: الأنبوب ${d+1} ماء نقي.`;
  else if(m===1) t=`انتقلت حبيبة واحدة إلى الأنبوب ${d+1}. هل يمكن أخذ نصفها؟ لا، الحبيبة لا تُقسَّم.`;
  else t=`انتقلت ${m} حبيبة إلى الأنبوب ${d+1}.`;
  if(d===CX.length-1) t+=' انتهت الأنابيب.';
  else t+=` التالي: الأنبوب ${d+1} ← ${d+2}.`;
  msg(t); ui();
}

let landed={};
function tick(dt){
  tubes.forEach(a=>a.forEach(g=>{
    g.x=Math.max(-38,Math.min(38,g.x+rnd(-1.3,1.3)));
    g.y=Math.max(368,Math.min(765,g.y+rnd(-1.3,1.3)));
    if(g.hi>0) g.hi--;
  }));
  if(flights.length){
    let counts={};
    for(let i=flights.length-1;i>=0;i--){
      const f=flights[i]; f.t+=dt;
      if(f.t>=f.dur){
        tubes[f.d].push({x:f.tx,y:f.ty,hi:0});
        counts[f.d]=(counts[f.d]||0)+1;
        flights.splice(i,1);
      }
    }
    if(!flights.length && busy){
      const d=step+1, s=step;
      finish(s,d,tubes[d].length,false);
    }
  }
}

function tubePath(cx){
  ctx.beginPath();
  ctx.moveTo(cx-HW,TOP); ctx.lineTo(cx-HW,BOT-HW);
  ctx.arc(cx,BOT-HW,HW,Math.PI,0,true);
  ctx.lineTo(cx+HW,TOP); ctx.closePath();
}

function draw(){
  if(bg.complete&&bg.naturalWidth) ctx.drawImage(bg,0,0,W,H); else {ctx.fillStyle='#3a78b8';ctx.fillRect(0,0,W,H);}
  ctx.save();
  // الحامل الخشبي أمام الأنابيب: لا يُرسم السائل عند شريطه
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(0,BAND_Y,W,BAND_H); ctx.clip('evenodd');
  tubes.forEach((a,i)=>{
    const cx=CX[i];
    ctx.globalCompositeOperation='source-over';
    tubePath(cx); ctx.fillStyle='rgba(130,195,255,.20)'; ctx.fill();
    const n=a.length;
    if(n>0){
      const alpha=0.05+0.6*Math.pow(n/N0,0.55);
      ctx.globalCompositeOperation='multiply';
      tubePath(cx); ctx.fillStyle=`rgba(225,40,150,${alpha})`; ctx.fill();
      ctx.globalCompositeOperation='source-over';
      a.forEach(g=>{
        const x=cx+g.x,y=g.y;
        if(g.hi>0){ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.strokeStyle='#ffd400';ctx.lineWidth=2.5;ctx.stroke();}
        ctx.beginPath();ctx.arc(x,y,3.4,0,7);ctx.fillStyle='#7a0a52';ctx.fill();
        ctx.lineWidth=.8;ctx.strokeStyle='rgba(255,255,255,.65)';ctx.stroke();
      });
    }
  });
  ctx.restore();
  // الحبيبات المنقولة تطير فوق الأنابيب
  flights.forEach(f=>{
    if(f.t<0) return;
    const u=f.t/f.dur, e=u*u*(3-2*u);
    const tx=CX[f.d]+f.tx;
    const x=f.sx+(tx-f.sx)*e;
    const y=f.sy+(f.ty-f.sy)*e-Math.sin(Math.PI*e)*260;
    ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fillStyle='rgba(255,212,0,.45)';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fillStyle='#7a0a52';ctx.fill();
  });
  if(lensTube>=0) drawLens();
  pills.forEach((p,i)=>{ const v=String(tubes[i].length); if(p.textContent!==v) p.textContent=v; });
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  tick(dt); draw(); requestAnimationFrame(loop);
}

$('go').onclick=transfer;
$('reset').onclick=reset;

// لوحة الأستاذ
let pMode='fixed';
function pSeg(m){pMode=m;$('pFixed').classList.toggle('on',m==='fixed');$('pRand').classList.toggle('on',m==='random');}
$('pFixed').onclick=()=>pSeg('fixed'); $('pRand').onclick=()=>pSeg('random');
$('sN').oninput=e=>$('vN').textContent=e.target.value;
$('sR').oninput=e=>$('vR').textContent=e.target.value+'%';
$('setBtn').onclick=()=>{
  $('sN').value=N0; $('vN').textContent=N0; $('sR').value=Math.round(RATIO*100); $('vR').textContent=Math.round(RATIO*100)+'%'; pSeg(mode);
  $('panel').classList.add('open');
};
$('pCancel').onclick=()=>$('panel').classList.remove('open');
$('pApply').onclick=()=>{
  N0=+$('sN').value; RATIO=+$('sR').value/100; mode=pMode;
  try{localStorage.setItem('dil',JSON.stringify({N0,RATIO,mode}));}catch(e){}
  $('panel').classList.remove('open'); closeLens(); reset();
};
try{
  const o=JSON.parse(localStorage.getItem('dil')||'null');
  if(o){ if(o.N0>=4&&o.N0<=400) N0=o.N0|0; if(o.RATIO>=.1&&o.RATIO<=.9) RATIO=o.RATIO; if(o.mode==='fixed'||o.mode==='random') mode=o.mode; }
}catch(e){}

// ملء الشاشة والاختصارات (تعتمد على e.code فتعمل مع أي تخطيط لوحة مفاتيح)
$('go').title='انقل عيّنة 10 مل إلى الأنبوب التالي (مسافة)';
$('lensBtn').title='عدسة مجهرية (L)';
$('setBtn').title='إعدادات الأستاذ (S)';
$('reset').title='إعادة التجربة من البداية';
$('fsBtn').title='ملء الشاشة (F)';
function toggleFS(){
  const d=document;
  if(d.fullscreenElement) d.exitFullscreen();
  else if(d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(()=>{});
}
if(!document.documentElement.requestFullscreen) $('fsBtn').style.display='none';
$('fsBtn').onclick=toggleFS;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const panelOpen=$('panel').classList.contains('open');
  if(e.code==='Escape'){ if(panelOpen) $('panel').classList.remove('open'); else if(lensTube>=0) closeLens(); return; }
  if(panelOpen) return;
  if(e.code==='KeyF'){ toggleFS(); return; }
  if(e.code==='KeyS'){ $('setBtn').click(); return; }
  if(e.code==='Space'){ e.preventDefault(); transfer(); return; }
  if(lensTube>=0){
    if(e.code==='ArrowLeft'&&lensTube<CX.length-1){ lensTube++; lensUI(); }
    else if(e.code==='ArrowRight'&&lensTube>0){ lensTube--; lensUI(); }
    else if(e.code==='KeyL') closeLens();
  }else if(e.code==='KeyL') openLens(Math.min(step,CX.length-1));
});
document.addEventListener('keyup',e=>{ if(e.code==='Space') e.preventDefault(); });
document.addEventListener('click',e=>{ if(e.target.tagName==='BUTTON') e.target.blur(); });

reset();
requestAnimationFrame(loop);
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
